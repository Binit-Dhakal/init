# ============================================================================
# tmux config  (previous version backed up at ~/.tmux.conf.bak)
# ============================================================================

# --- Plugins (loaded by tpm at the very bottom of this file) ---------------
set -g @plugin 'tmux-plugins/tmux-yank'

# --- Truecolor (24-bit) support --------------------------------------------
# Without these, tmux quantizes Neovim's colors to 256, breaking catppuccin
# and diff highlights. default-terminal advertises 256color to apps inside
# tmux; the override tells tmux the OUTER terminal (Ghostty) supports RGB.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# --- General ----------------------------------------------------------------
set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g history-limit 50000
set -sg escape-time 0          # no lag after <Esc> (important for Neovim)
set -g focus-events on         # lets Neovim detect focus (autoread, etc.)
set -g allow-passthrough on    # forward image escape codes (kitty graphics) to Ghostty,
                               # needed for snacks.nvim to render images inside tmux
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on     # close window 2 of 3 -> 3 becomes 2
set -g status-interval 5       # refresh status bar (git branch, etc.)

# --- Prefix: C-a ------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Window names: show the FOLDER name instead of "nvim" ------------------
# Uses the last directory component of the pane's current path.
# (If you rename a window manually with <prefix>, it stops auto-renaming.)
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off        # programs can't override the name

# --- Keybindings ------------------------------------------------------------
# Split / new window in the CURRENT directory (default opens in home dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Copy to system clipboard from copy-mode with `y`
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

# --- Look & feel (catppuccin mocha on black, matches the Neovim theme) -----
#   base #000000  text #cdd6f4  surface #313244  overlay #6c7086
#   mauve #cba6f7  blue #89b4fa  green #a6e3a1  peach #fab387  red #f38ba8
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 80

# Left: session name (turns red + shows PREFIX while the prefix key is held)
set -g status-left "#{?client_prefix,#[bg=#f38ba8#,fg=#000000#,bold] PREFIX ,#[bg=#cba6f7#,fg=#000000#,bold] #S }#[bg=#000000,fg=default,nobold] "

# Right: git branch of the active pane's folder, then time
set -g status-right "#[fg=#a6e3a1]#(git -C #{pane_current_path} branch --show-current 2>/dev/null | sed 's/^/ /')  #[fg=#6c7086]%a %d %b  #[fg=#89b4fa,bold]%H:%M "

# Window tabs: "1 folder"; the current one is highlighted
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086] #I #[fg=#9399b2]#W "
set -g window-status-current-format "#[bg=#313244,fg=#fab387,bold] #I #[fg=#cdd6f4]#W #[bg=#000000,fg=default,nobold]"

# --- "kiro wants you" indicator -------------------------------------------
# kiro-cli (chat.notificationMethod = bel) rings the terminal bell when it
# finishes / pauses for your input or approval. tmux catches that bell and
# turns the window's tab RED so you can spot it across many sessions.
# The flag clears automatically when you switch to that window.
set -g monitor-bell on
set -g bell-action other                 # flag bells in other (unfocused) windows
set -g visual-bell off                   # no audible beep; just the colour flag
set -g window-status-bell-style "bg=#f38ba8,fg=#000000,bold"
# Keep activity monitoring OFF: an agent that is WORKING also produces output,
# so activity would flag "busy", not "waiting". Bell is the precise signal.
set -g monitor-activity off
set -g visual-activity off

# --- kiro cross-workspace session picker ----------------------------------
# <prefix> S  ->  fuzzy-pick any kiro session from ANY project and resume it
# in a new window. Fixes "which tab was doing what" across many sessions.
# (Was <prefix> k, but k is pane-up navigation — moved to S for "Sessions".)
bind S display-popup -E -w 85% -h 70% "~/.config/tmux/kiro-session-picker.sh"

# <prefix> E  ->  delete all empty / no-title kiro sessions (opened but unused)
bind E display-popup -E -w 70% -h 50% "~/.config/tmux/kiro-clean-empty.sh"

# Pane borders and messages
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#cba6f7,fg=#000000"

# --- tmux-restore / resurrect / continuum tuning ---------------------------
# (Kept OUTSIDE the installer's fenced block so re-running the installer
#  leaves these as-is.)
set -g @continuum-save-interval '5'      # auto-save every 5 minutes (default 15)
set -g @resurrect-capture-pane-contents 'on'  # bring back scrollback
set -g @resurrect-strategy-nvim 'session'     # restore nvim via its session

# --- tpm (keep this line at the very bottom) -------------------------------
# >>> tmux-restore >>>
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'andrewboldi/tmux-resurrect#fix-concurrent-restore'
set -g @plugin 'andrewboldi/tmux-restore'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# <<< tmux-restore <<<
run '~/.tmux/plugins/tpm/tpm'
